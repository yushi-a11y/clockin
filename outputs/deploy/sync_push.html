<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>班表同步</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>body{font-family:system-ui;max-width:600px;margin:40px auto;padding:0 20px;background:#f8fafc}
.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:16px}
h1{font-size:18px;margin:0 0 12px}
.status{padding:8px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.ok{background:#dcfce7;color:#16a34a}.err{background:#fee2e2;color:#dc2626}
.info{background:#dbeafe;color:#2563eb}.warn{background:#fef3c7;color:#d97706}
.member{padding:4px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
button{background:#0d9488;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;margin-top:8px}
button:hover{background:#0f766e}button:disabled{background:#94a3b8;cursor:not-allowed}
</style></head><body>
<div class="card">
<h1>🔄 钉钉班表同步</h1>
<div id="log"></div>
<button id="syncBtn" onclick="pushToFirestore()">推送到 Firestore</button>
</div>
<div class="card" id="membersCard" style="display:none">
<h1>成员排班（7月20日）</h1>
<div id="membersList"></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDNTeA22IfjFjvjN5Gg_pfq0dT2jlNKVho",authDomain:"aaaa-1a0a9.firebaseapp.com",projectId:"aaaa-1a0a9",storageBucket:"aaaa-1a0a9.firebasestorage.app",messagingSenderId:"1057072593476",appId:"1:1057072593476:web:6032cc5ff82100285e5a11",measurementId:"G-W2L8QWSD8X"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const log=(msg,cls='info')=>{document.getElementById('log').innerHTML+=`<div class="status ${cls}">${msg}</div>`};

const TEAM=[
{id:1,name:'133122',dept:'',shiftIds:[25,11,12,13,14,21,22]},
{id:2,name:'3051105',dept:'',shiftIds:[8,9,10,12,13]},
{id:3,name:'3060017',dept:'',shiftIds:[8,16,17]},
{id:4,name:'3065861',dept:'',shiftIds:[7,9,10,11,17]},
{id:5,name:'3072437',dept:'',shiftIds:[7,9,11,12,20,21,22]},
{id:6,name:'8027356',dept:'',shiftIds:[8,9,10,14,16,17,18]},
{id:7,name:'8094271',dept:'',shiftIds:[18]},
{id:8,name:'8139540',dept:'',shiftIds:[11,13,15,16,17,18]},
{id:9,name:'8191272',dept:'',shiftIds:[24,13,15,16,20,22,23]},
{id:10,name:'8191398',dept:'',shiftIds:[11,14,17,19,20]},
{id:11,name:'8593490',dept:'',shiftIds:[24,12,13,19,20,21,23]},
{id:12,name:'8596120',dept:'',shiftIds:[24,25,18,19,21,22,23]},
{id:13,name:'8597644',dept:'',shiftIds:[10,12,19]},
{id:14,name:'8598314',dept:'',shiftIds:[14,15,18]},
{id:15,name:'8600441',dept:'',shiftIds:[14,15,19,20,21]},
{id:16,name:'8091129',dept:'',shiftIds:[]},
{id:17,name:'8593305',dept:'',shiftIds:[]}
];

// Show members
const mc=document.getElementById('membersCard');mc.style.display='block';
const ml=document.getElementById('membersList');
TEAM.forEach(m=>{
  const shifts=m.shiftIds.map(id=>{
    if(id===24)return'00:00-01:00';if(id===25)return'01:00-02:00';
    return`${String(id).padStart(2,'0')}:00-${String((id+1)%24).padStart(2,'0')}:00`;
  }).join(', ')||'无排班';
  ml.innerHTML+=`<div class="member"><b>${m.name}</b> — ${shifts} (${m.shiftIds.length}个)</div>`;
});

async function pushToFirestore(){
  const btn=document.getElementById('syncBtn');btn.disabled=true;btn.textContent='推送中...';
  log('正在连接 Firestore...','info');
  try{
    await db.collection('config').doc('team').set({data:TEAM,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),source:'dingtalk-sync'});
    log(`✅ 成员排班已推送！${TEAM.length}人 · ${TEAM.filter(m=>m.shiftIds.length).length}人有班次`,'ok');
    // Also push shifts to ensure consistency
    log('正在同步时段配置...','info');
    const shifts=[];
    for(let h=7;h<24;h++){const eh=(h+1)%24;shifts.push({id:h,name:`${String(h).padStart(2,'0')}:00-${String(eh).padStart(2,'0')}:00`,start:`${String(h).padStart(2,'0')}:00`,end:`${String(eh).padStart(2,'0')}:00`,tolerance:5,enabled:true,cross:h>=23})}
    for(let h=0;h<2;h++)shifts.push({id:24+h,name:`${String(h).padStart(2,'0')}:00-${String(h+1).padStart(2,'0')}:00`,start:`${String(h).padStart(2,'0')}:00`,end:`${String(h+1).padStart(2,'0')}:00`,tolerance:5,enabled:true,cross:false});
    await db.collection('config').doc('shifts').set({data:shifts,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    log(`✅ 时段配置已推送！${shifts.length}个时段`,'ok');
    log('🎉 所有设备将通过 Firestore 监听自动更新排班数据','ok');
    btn.textContent='同步完成';
  }catch(e){
    log(`❌ 推送失败：${e.message}`,'err');
    log('请检查 Firestore 安全规则是否允许写入','warn');
    btn.disabled=false;btn.textContent='重试';
  }
}
</script></body></html>
