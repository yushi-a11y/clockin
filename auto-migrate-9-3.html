<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>自动迁移 9/3 打卡数据</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #eee; }
    .log { background: #2a2a2a; padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 13px; }
    .success { color: #51cf66; }
    .error { color: #ff6b6b; }
    .info { color: #74c0fc; }
  </style>
</head>
<body>
  <h1>自动迁移 9/3 打卡数据</h1>
  <p>从 Supabase 迁移缺失的打卡记录到 Firestore</p>
  <div id="output"></div>
  
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, addDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    
    const output = document.getElementById('output');
    function log(msg, cls = '') {
      const div = document.createElement('div');
      div.className = 'log ' + cls;
      div.textContent = msg;
      output.appendChild(div);
      console.log(msg);
    }
    
    const firebaseConfig = { projectId: "clockin-b691a" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // 从 Supabase 查询到的缺失记录
    const missingPunches = [
      {"mid": 8, "sid": 13, "t": "s", "time": "12:58", "date": "2026-09-03", "name": "8094271", "sd": "2026-09-03", "ts": 1788411480000},
      {"mid": 8, "sid": 13, "t": "e", "time": "14:01", "date": "2026-09-03", "name": "8094271", "sd": "2026-09-03", "ts": 1788415260000},
      {"mid": 8, "sid": 14, "t": "s", "time": "14:01", "date": "2026-09-03", "name": "8094271", "sd": "2026-09-03", "ts": 1788415260000},
      {"mid": 8, "sid": 14, "t": "e", "time": "14:59", "date": "2026-09-03", "name": "8094271", "sd": "2026-09-03", "ts": 1788418740000},
      {"mid": 8, "sid": 15, "t": "s", "time": "14:59", "date": "2026-09-03", "name": "8094271", "sd": "2026-09-03", "ts": 1788418740000},
      {"mid": 8, "sid": 15, "t": "e", "time": "15:55", "date": "2026-09-03", "name": "8094271", "sd": "2026-09-03", "ts": 1788422100000}
    ];
    
    async function migrate() {
      log('=== 开始迁移 9/3 缺失的打卡数据 ===', 'info');
      log(`待迁移记录数: ${missingPunches.length}`, 'info');
      
      let success = 0;
      let failed = 0;
      
      for (let i = 0; i < missingPunches.length; i++) {
        const punch = missingPunches[i];
        try {
          const docRef = await addDoc(collection(db, 'punches'), {
            ...punch,
            makeup: false,
            migrated_from: 'supabase',
            migrated_at: Date.now()
          });
          success++;
          log(`✓ [${i+1}/${missingPunches.length}] ${punch.name} ${punch.t==='s'?'上班':'下班'} ${punch.time} 班次${punch.sid} → ${docRef.id}`, 'success');
        } catch (e) {
          failed++;
          log(`✗ [${i+1}/${missingPunches.length}] 失败: ${e.message}`, 'error');
        }
      }
      
      log('', 'info');
      log(`=== 迁移完成: 成功 ${success} 条, 失败 ${failed} 条 ===`, success === missingPunches.length ? 'success' : 'error');
      log('请刷新管理后台查看更新后的出勤率', 'info');
    }
    
    // 自动执行迁移
    setTimeout(migrate, 1000);
  </script>
</body>
</html>
