<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>15 人并发选班测试</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #eee; max-width: 800px; margin: 0 auto; }
    .card { background: #2a2a2a; padding: 15px; border-radius: 8px; margin: 10px 0; }
    .log { background: #1a1a1a; padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 12px; max-height: 400px; overflow-y: auto; }
    .success { color: #51cf66; }
    .error { color: #ff6b6b; }
    .info { color: #74c0fc; }
    button { background: #4a9eff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
    button:hover { background: #3a8eef; }
    button:disabled { background: #666; cursor: not-allowed; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 10px 0; }
    .stat { background: #333; padding: 10px; border-radius: 4px; text-align: center; }
    .stat-value { font-size: 24px; font-weight: bold; }
    .stat-label { font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h1>🔥 15 人并发选班压力测试</h1>
  
  <div class="card">
    <h3>测试配置</h3>
    <div>
      <label>测试日期: <input type="date" id="testDate" value="2026-09-05"></label>
      <label>班次 ID: <input type="number" id="testShift" value="7" min="1" max="25"></label>
      <label>模拟人数: <input type="number" id="testUsers" value="15" min="1" max="30"></label>
    </div>
    <div style="margin-top: 10px;">
      <button onclick="startTest()" id="startBtn">开始测试</button>
      <button onclick="resetTest()" id="resetBtn">重置</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">总请求</div>
    </div>
    <div class="stat">
      <div class="stat-value success" id="statSuccess">0</div>
      <div class="stat-label">成功</div>
    </div>
    <div class="stat">
      <div class="stat-value error" id="statFailed">0</div>
      <div class="stat-label">失败</div>
    </div>
    <div class="stat">
      <div class="stat-value info" id="statAvgTime">0ms</div>
      <div class="stat-label">平均耗时</div>
    </div>
  </div>

  <div class="card">
    <h3>实时日志</h3>
    <div class="log" id="log"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, doc, getDoc, setDoc, runTransaction } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = { projectId: "clockin-b691a" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let testRunning = false;
    let stats = { total: 0, success: 0, failed: 0, times: [] };

    function log(msg, type = '') {
      const logEl = document.getElementById('log');
      const div = document.createElement('div');
      div.className = type;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = stats.total;
      document.getElementById('statSuccess').textContent = stats.success;
      document.getElementById('statFailed').textContent = stats.failed;
      const avg = stats.times.length ? Math.round(stats.times.reduce((a, b) => a + b, 0) / stats.times.length) : 0;
      document.getElementById('statAvgTime').textContent = avg + 'ms';
    }

    async function simulatePick(dateStr, mid, sid, retryCount = 0) {
      const startTime = Date.now();
      stats.total++;
      
      try {
        const result = await runTransaction(db, async (tx) => {
          const docRef = doc(db, 'config', 'picks');
          const docSnap = await tx.get(docRef);
          const picks = docSnap.exists ? (docSnap.data().data || {}) : {};
          
          if (!picks[dateStr]) picks[dateStr] = {};
          const cur = (picks[dateStr][String(mid)] || []).slice();
          if (!cur.includes(Number(sid))) cur.push(Number(sid));
          picks[dateStr][String(mid)] = cur.sort((a, b) => a - b);
          
          tx.set(docRef, { data: picks, updated_at: Date.now() }, { merge: true });
          return picks;
        });

        const elapsed = Date.now() - startTime;
        stats.times.push(elapsed);
        stats.success++;
        log(`用户 ${mid} 选班成功 (${elapsed}ms)`, 'success');
        return true;
      } catch (e) {
        const elapsed = Date.now() - startTime;
        
        // 事务冲突时重试
        if (e.message && /transaction|conflict/i.test(e.message) && retryCount < 3) {
          log(`用户 ${mid} 冲突，重试 ${retryCount + 1}/3`, 'info');
          await new Promise(r => setTimeout(r, 100 * (retryCount + 1)));
          return simulatePick(dateStr, mid, sid, retryCount + 1);
        }
        
        stats.times.push(elapsed);
        stats.failed++;
        log(`用户 ${mid} 失败：${e.message} (${elapsed}ms)`, 'error');
        return false;
      }
    }

    window.startTest = async function() {
      if (testRunning) return;
      testRunning = true;
      document.getElementById('startBtn').disabled = true;
      
      const dateStr = document.getElementById('testDate').value;
      const sid = parseInt(document.getElementById('testShift').value);
      const numUsers = parseInt(document.getElementById('testUsers').value);
      
      log(`开始测试：${numUsers} 人同时选 ${dateStr} 班次${sid}`, 'info');
      
      // 模拟 15 个用户同时选班
      const promises = [];
      for (let i = 1; i <= numUsers; i++) {
        // 随机延迟 0-500ms 模拟真实场景
        const delay = Math.random() * 500;
        promises.push(
          new Promise(resolve => {
            setTimeout(() => {
              simulatePick(dateStr, 100 + i, sid).then(resolve);
            }, delay);
          })
        );
      }
      
      const results = await Promise.all(promises);
      const successCount = results.filter(r => r).length;
      
      log(`测试完成：${successCount}/${numUsers} 成功`, successCount === numUsers ? 'success' : 'error');
      updateStats();
      
      testRunning = false;
      document.getElementById('startBtn').disabled = false;
    };

    window.resetTest = function() {
      stats = { total: 0, success: 0, failed: 0, times: [] };
      updateStats();
      document.getElementById('log').innerHTML = '';
      log('已重置', 'info');
    };

    log('测试工具已加载，点击"开始测试"运行', 'info');
  </script>
</body>
</html>
